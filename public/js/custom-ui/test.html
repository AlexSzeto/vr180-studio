       */
      function Section({ children }) {
        const [expanded, setExpanded] = useState(false)
        const childArray = []
          .concat(children || [])
          .filter((c) => c != null && c !== false && c !== '')
        const header = childArray[0]
        const content = childArray.slice(1)
        return html`

          <${CollapsiblePanel}
            header=${header}
            content=${html`<div style=${{ paddingTop: '12px' }}>${content}</div>`}
            expanded=${expanded}
            onExpand=${() => setExpanded((e) => !e)}
          />
        </${SectionWrapper}>

      /**

        const nav = useItemNavigation(items, selected || items[0])

        // Sync nav.currentItem with parent's selected state

        return html`

      /**

        const toast = useToast()

        const handleBasicDialog = () => {

            'Confirm Delete',

          const result = await showDialog(

      // =========================================================================
      // GlobalBgmPlayer Demo Component
      // =========================================================================

      const CROSSFADE_DURATION = 3

      const DEMO_PLAYLIST = [
        '/js/custom-ui/demo/sample-music-track-1.mp3',
        '/js/custom-ui/demo/sample-music-track-2.mp3',
        '/js/custom-ui/demo/sample-music-track-3.mp3',
        '/js/custom-ui/demo/sample-music-track-4.mp3',
      ]

      function BgmPlayerDemo() {
        const [playing, setPlaying] = useState(false)
        const [track, setTrack] = useState(null)
        const [currentTime, setCurrentTime] = useState(0)
        const [duration, setDuration] = useState(0)
        const timeUpdateHandlerRef = useRef(null)
        const prevAudioRef = useRef(null)

        // Subscribe to player events
        useEffect(() => {
          return globalBgmPlayer.subscribe((e) => {
            if (e.event === 'track-start') {
              setTrack(e)
              setDuration(globalBgmPlayer.getDuration())
              setCurrentTime(0)
            }
            if (e.event === 'stop') {
              setPlaying(false)
              setTrack(null)
              setCurrentTime(0)
              setDuration(0)
            }
          })
        }, [])

        // Attach timeupdate listener to the current audio element when track changes
        useEffect(() => {
          if (!playing) return
          const update = () => {
            setCurrentTime(globalBgmPlayer.getCurrentTime())
            setDuration(globalBgmPlayer.getDuration())
          }
          const attachToCurrentAudio = () => {
            const audio = globalBgmPlayer.getCurrentAudioElement()
            if (!audio) return
            if (prevAudioRef.current && prevAudioRef.current !== audio) {
              prevAudioRef.current.removeEventListener(
                'timeupdate',
                timeUpdateHandlerRef.current,
              )
            }
            timeUpdateHandlerRef.current = update
            prevAudioRef.current = audio
            audio.addEventListener('timeupdate', update)
          }
          attachToCurrentAudio()
          return () => {
            if (prevAudioRef.current && timeUpdateHandlerRef.current) {
              prevAudioRef.current.removeEventListener(
                'timeupdate',
                timeUpdateHandlerRef.current,
              )
            }
          }
        }, [playing, track])

        const handlePlay = () => {
          if (globalBgmPlayer.isPlaying()) {
            globalBgmPlayer.stop()
            setPlaying(false)
          } else {
            globalBgmPlayer.setPlaylist(DEMO_PLAYLIST)
            globalBgmPlayer.setTransition({
              mode: 'crossfade',
              durationSeconds: CROSSFADE_DURATION,
            })
            globalBgmPlayer.play()
            setPlaying(true)
          }
        }

        const formatTime = (s) => {
          if (!isFinite(s) || s < 0) return '0:00'
          const m = Math.floor(s / 60)
          const sec = Math.floor(s % 60)
          return m + ':' + String(sec).padStart(2, '0')
        }

        const progress =
          duration > 0 ? Math.min(100, (currentTime / duration) * 100) : 0
        const theme = currentTheme.value

        return html`
        <div style="display: flex; flex-direction: column; gap: 8px; width: 340px;">

          <!-- Status / track info row -->
          <div style="font-size: 13px; color: ${theme.colors.text.secondary}; min-height: 18px;">
            ${
              track
                ? html`<span
                    ><strong>${track.label}</strong> · ${track.index + 1} /
                    ${track.total}</span
                  >`
                : 'Ready · 4 local tracks'
            }
          </div>

          <!-- Panel: play button + progress bar + times -->
          <${Panel} variant="glass" padding="medium" style=${{ display: 'flex', alignItems: 'center', gap: theme.spacing.small.gap }}>
            <${Button}
              size="small"
              color="secondary"
              icon=${playing ? 'stop' : 'play'}
              disabled=${false}
              onClick=${handlePlay}
              title=${playing ? 'Stop' : 'Play'}
            />

            <!-- Progress bar -->
            <div style="flex: 1; display: flex; align-items: center; gap: 6px;">
              <span style="font-family: monospace; font-size: ${theme.typography.fontSize.small}; color: ${theme.colors.text.secondary}; min-width: 36px; text-align: center;">
                ${formatTime(currentTime)}
              </span>
              <div style="
                flex: 1; height: 6px; border-radius: 3px; overflow: hidden;
                background: ${theme.colors.overlay.background};
              ">
                <div style="
                  height: 100%; border-radius: 3px;
                  width: ${progress}%;
                  background: ${theme.colors.primary.background};
                  transition: width 0.1s linear;
                "></div>
              </div>
              <span style="font-family: monospace; font-size: ${theme.typography.fontSize.small}; color: ${theme.colors.text.secondary}; min-width: 36px; text-align: center;">
                ${formatTime(duration)}
              </span>
            </div>
          </${Panel}>

          <div style="font-size: 11px; opacity: 0.45;">
            Crossfade ${CROSSFADE_DURATION} s · loops playlist · backed by HTMLAudioElement + Web Audio gain
          </div>
        </div>
      `
      }

      // ── AutocompleteDropdown + useAutocomplete demo ───────────────────────────

      /**
       * Live `useInputValidation` demo. The "validator" is a setTimeout-backed
       * predicate rather than a real endpoint, so the validating → settled
       * transition is observable without any service dependency.
       */
      function ValidationHookDemo() {
        const [value, setValue] = useState('')
        const v = useInputValidation({
          debounceMs: 600,
          validate: async (path) => {
            await new Promise((r) => setTimeout(r, 900))
            if (!path.trim()) return null
            if (!path.startsWith('/')) {
              return { status: 'invalid', message: 'Path must be absolute' }
            }
            if (path.includes(' ')) {
              return {
                status: 'warning',
                message: 'Path contains spaces — this usually still works',
              }
            }
            return { status: 'valid', message: 'Path verified' }
          },
        })

        return html`
          <div style="max-width: 420px;">
            <${Input}
              label="Install path (type to validate)"
              placeholder="/opt/comfyui"
              value=${value}
              onInput=${(e) => {
                setValue(e.target.value)
                v.onValueChange(e.target.value)
              }}
              validation=${v.validation}
            />
            <p style="margin-top: 8px; opacity: 0.7; font-size: 0.85rem;">
              600 ms debounce, then a 900 ms fake check. Try an empty value
              (idle), <code>opt/comfyui</code> (invalid),
              <code>/opt/my comfy</code> (warning), <code>/opt/comfyui</code>
              (valid).
            </p>
          </div>
        `
      }

      /**
       * Splits COMPOSITION.md into recipes: each `## Recipe: <name>` line
       * starts one, and its prose runs to the next line starting `## ` (or
       * EOF). Non-recipe `##` sections are dropped.
       */
      function parseRecipes(text) {
        const recipes = {}
        let current = null
        for (const line of text.split(/\r?\n/)) {
          if (line.startsWith('## Recipe: ')) {
            current = line.slice('## Recipe: '.length).trim()
            recipes[current] = []
          } else if (line.startsWith('## ')) {
            current = null
          } else if (current) {
            recipes[current].push(line)
          }
        }
        return Object.fromEntries(
          Object.entries(recipes).map(([k, v]) => [k, v.join('\n').trim()]),
        )
      }

        const [size, setSize] = useState('medium')
        return html`

            <//>
          </${Section}>
        `
      }

      /**
       * Renders every recipe of COMPOSITION.md beside its live demo. If the
       * guide cannot be fetched (e.g. file://), the demos still render
       * without prose.
       */
      function CompositionGuide() {
        const [recipes, setRecipes] = useState(null)
        const [failed, setFailed] = useState(false)
        useEffect(() => {
          fetch('./COMPOSITION.md')
            .then((res) => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`)
              return res.text()
            })
            .then((text) => setRecipes(parseRecipes(text)))
            .catch((err) => {
              log(
                'test-page',
                'warn',
                `Could not load COMPOSITION.md: ${err.message}`,
              )
              setFailed(true)
            })
        }, [])
        return html`
          ${
            failed &&
            html`<${MutedText}
              >COMPOSITION.md could not be loaded — showing the demos without
              their recipe prose.<//
            >`
          }
          ${Object.entries(COMPOSITION_DEMOS).map(
            ([name, Demo]) => html`
              <${CompositionRecipe}
                key=${name}
                name=${name}
                prose=${recipes ? (recipes[name] ?? null) : null}
                Demo=${Demo}
              />
            `,
          )}
        `
      }

              delete this.subscribers[taskId]
            },
            // Simulate progress updates with realistic step changes. With
            // `remainingSeconds`, every event carries that fixed estimate,
            // which the banner shows as "2m14s left".
            simulateProgress(taskId, { remainingSeconds } = {}) {
              const handlers = this.subscribers[taskId]
              if (!handlers) return

              // Define realistic steps with progress ranges
              const steps = [
                {
                  range: [0, 15],
                  name: 'Loading model...',
                  node: 'CheckpointLoaderSimple',
                },
                {
                  range: [15, 25],
                  name: 'Loading LoRA...',
                  node: 'LoraLoaderModelOnly',
                },
                {
                  range: [25, 35],
                  name: 'Encoding prompt...',
                  node: 'CLIPTextEncode',
                },
                {
                  range: [35, 40],
                  name: 'Preparing canvas...',
                  node: 'EmptyLatentImage',
                },
                {
                  range: [40, 85],
                  name: 'Sampling image...',
                  node: 'KSampler',
                },
                {
                  range: [85, 95],
                  name: 'Decoding image...',
                  node: 'VAEDecode',
                },
                {
                  range: [95, 100],
                  name: 'Saving image...',
                  node: 'SaveImage',
                },
              ]

              let progress = 0
              let stepIndex = 0

              const interval = setInterval(() => {
                progress += 2 // Increment by 2% for smoother animation

                // Find current step
                while (
                  stepIndex < steps.length - 1 &&
                  progress > steps[stepIndex].range[1]
                ) {
                  stepIndex++
                }

                const currentStep = steps[stepIndex]

                if (progress <= 100) {
                  handlers.onProgress?.({
                    progress: {
                      percentage: progress,
                      currentValue: progress,
                      maxValue: 100,
                      currentStep: currentStep.name,
                      node: currentStep.node,
                    },
                    ...(remainingSeconds !== undefined
                      ? { remainingSeconds }
                      : {}),
                  })
                }

                if (progress >= 100) {
                  clearInterval(interval)
                  handlers.onComplete?.({
                    progress: { maxValue: 100 },
                  })
                }
              }, 200) // Faster updates for smoother animation
            },
            // Simulate error
            simulateError(taskId) {
              const handlers = this.subscribers[taskId]
              if (!handlers) return

              setTimeout(() => {
                handlers.onError?.({
                  error: { message: 'Simulated generation error' },
                })
              }, 1000)
            },
          }
        }

                <p style="margin-bottom: 16px; opacity: 0.7;">Web Audio API–based background music player with crossfade/fade transitions. Voice (AudioPlayer) and BGM coexist independently.</p>
                <${ComponentGrid}>
                  <${BgmPlayerDemo} />
                </${ComponentGrid}>
              </${Section}>

              <${CategoryHeader}>Message/Notification Components<//>

              <${Section}>
                <${SectionTitle}>Toast Component</${SectionTitle}>

                <${ComponentGrid}>
                  <${ToastTriggers} />
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>ProgressBanner Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Fixed banner that displays real-time progress for tasks, auto-dismisses on completion/error. Now uses provider pattern with useProgress hook.</p>

                <${ComponentGrid}>
                  <${ProgressTriggers} mockSSEManager=${this.mockSSEManager} />
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>FormStatusPanel Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Form-wide (non-field) status messages. Goes immediately above a form's Save/Revert/Delete row. Renders nothing when there are no messages or the status is idle.</p>

                <${ComponentGrid}>
                  <${FormStatusPanel} messages=${['Name is already in use by another preset']} />
                  <${FormStatusPanel}
                    messages=${[
                      'Name is required',
                      'Port must be a number',
                      'Install path does not exist',
                    ]}
                  />
                  <${FormStatusPanel} status="valid" messages=${['All settings validated']} />
                  <${FormStatusPanel} status="warning" messages=${['Workflow has no sampler node — generation may fail']} />
                  <${FormStatusPanel} status="validating" messages=${['Checking install path…']} />
                  <!-- Empty messages array: renders nothing at all -->
                  <${FormStatusPanel} messages=${[]} />
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>LogView Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Generic, layout-agnostic scrollable log display — no fixed height, fills whatever box its parent gives it. Follow-tail toggle auto-scrolls on new lines until the user scrolls away; stderr lines tint danger, meta lines use secondary text.</p>

                <${ComponentGrid}>
                  <${LogViewDemo} />
                  <div style="height: 240px; max-width: 500px;">
                    <${LogView} lines=${[]} followTail=${true} onFollowTailChange=${() => {}} onCopy=${() => {}} emptyMessage="No output yet" />
                  </div>
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>StackedMeter Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Segmented bar against a maximum. Segment colours are a theme colour group name or a CSS colour; hover a segment for its label. The thin vertical tick marks a remembered value (a peak) and shows its tooltip on hover. A total past <code>max</code> clamps to the full bar in <code>overColor</code> (default danger).</p>

                <${ComponentGrid}>
                  <div style="width: 320px;">
                    <${StackedMeter}
                      max=${8192}
                      segments=${[
                        {
                          value: 410,
                          color: 'secondary',
                          label: 'AnyTale 0.4 GB',
                        },
                        {
                          value: 4200,
                          color: 'primary',
                          label: 'ComfyUI 4.1 GB',
                        },
                        {
                          value: 1326,
                          color: 'success',
                          label: 'llama.cpp 1.3 GB',
                        },
                      ]}
                      marker=${{ value: 7100, tooltip: 'Peak 6.9 GB' }}
                    />
                  </div>
                  <div style="width: 320px;">
                    <${StackedMeter}
                      max=${8192}
                      segments=${[
                        {
                          value: 7000,
                          color: 'primary',
                          label: 'ComfyUI 6.8 GB',
                        },
                        {
                          value: 2000,
                          color: 'success',
                          label: 'llama.cpp 2.0 GB',
                        },
                      ]}
                      marker=${{ value: 9000, tooltip: 'Peak 8.8 GB (over max)' }}
                    />
                  </div>
                <//>
              </${Section}>

              <${CategoryHeader}>Overlay Components<//>

              <${Section}>
                <${SectionTitle}>Dialog Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Modal dialog with overlay - supports basic alerts, confirmations, and text prompts</p>

                <${ComponentGrid}>
                  <${DialogTriggers} />
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>Modal Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Declarative modal component with customizable size, header, content, and footer</p>

                <${ComponentGrid}>
                  <div style="display: flex; flex-direction: column; gap: 8px;">
                    <${Button}
                      color="primary"
                      onClick=${() => this.setState({ modalOpen: true, modalSize: 'small' })}
                    >
                      Show Small Modal
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() => this.setState({ modalOpen: true, modalSize: 'medium' })}
                    >
                      Show Medium Modal
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() => this.setState({ modalOpen: true, modalSize: 'large' })}
                    >
                      Show Large Modal
                    <//>
                    <${Button}
                      color="secondary"
                      onClick=${() => createImageModal('/js/custom-ui/demo/sample-album-cover-1.jpg', false, 'Sample Image')}
                    >
                      Show Image Modal
                    <//>
                    <${Button}
                      color="success"
                      onClick=${() =>
                        createImageModal(
                          '/js/custom-ui/demo/sample-album-cover-1.jpg',
                          true,
                          'Selectable Image',
                          () => alert('Image selected!'),
                          'Select This Image',
                        )}
                    >
                      Show Image Modal with Select
                    <//>
                  </div>
                <//>

                <${Modal}
                  isOpen=${this.state.modalOpen}
                  onClose=${() => this.setState({ modalOpen: false })}
                  title=${`Modal Example (${this.state.modalSize})`}
                  size=${this.state.modalSize}
                  footer=${html`
                    <${Button}
                      color="secondary"
                      onClick=${() => this.setState({ modalOpen: false })}
                    >
                      Cancel
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() => {
                        alert('Action confirmed!')
                        this.setState({ modalOpen: false })
                      }}
                    >
                      Confirm
                    <//>
                  `}
                >
                  <p>This is a ${this.state.modalSize} size modal with custom footer buttons.</p>
                  <p style="margin-top: 16px;">The Modal component supports:</p>
                  <ul style="margin-top: 8px; padding-left: 20px;">
                    <li>Multiple size variants (small, medium, large, full)</li>
                    <li>Custom header, content, and footer</li>
                    <li>Escape key to close</li>
                    <li>Click outside to close</li>
                    <li>Body scroll locking when open</li>
                  </ul>
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>ListSelect Component</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Modal list selection with optional actions</p>

                <${ComponentGrid}>
                  <${Button}
                    icon="list-ul"
                    color="primary"
                    onClick=${() => {
                      showListSelect({
                        title: 'Select Item',
                        items: [
                          { id: '1', label: 'Option 1' },
                          { id: '2', label: 'Option 2' },
                          { id: '3', label: 'Option 3' },
                          { id: '4', label: 'Disabled Option', disabled: true },
                        ],
                        itemIcon: 'check-circle',
                        onSelectItem: (item) => {
                          console.log('Selected:', item)
                        },
                      })
                    }}
                  >
                    Basic List Select
                  <//>

                  <${Button}
                    icon="folder"
                    color="secondary"
                    onClick=${() => {
                      showListSelect({
                        title: 'Select Folder',
                        items: [
                          { id: 'f1', label: 'Documents', icon: 'folder' },
                          { id: 'f2', label: 'Images', icon: 'folder' },
                          { id: 'f3', label: 'Videos', icon: 'folder' },
                        ],
                        selectedId: 'f2',
                        onSelectItem: (item) => {
                          console.log('Selected folder:', item)
                        },
                      })
                    }}
                  >
                    Folder Select
                  <//>

                  <${Button}
                    icon="cog"
                    color="success"
                    onClick=${() => {
                      showListSelect({
                        title: 'Manage Items',
                        items: [
                          { id: 'i1', label: 'Editable Item 1', icon: 'file' },
                          { id: 'i2', label: 'Editable Item 2', icon: 'file' },
                          {
                            id: 'i3',
                            label: 'Protected Item',
                            icon: 'lock',
                            disabled: true,
                          },
                        ],
                        itemActions: [
                          {
                            icon: 'edit',
                            title: 'Edit',
                            onClick: (item) => console.log('Edit:', item),
                          },
                          {
                            icon: 'trash',
                            color: 'danger',
                            title: 'Delete',
                            onClick: (item) => console.log('Delete:', item),
                          },
                        ],
                        actionLabel: 'New Item',
                        onSelectItem: (item) => {
                          console.log('Selected:', item)
                        },
                        onAction: () => {
                          console.log('Create new item')
                        },
                      })
                    }}
                  >
                    With Actions
                  <//>

                  <${Button}
                    icon="list-ul"
                    color="secondary"
                    onClick=${() => {
                      showListSelect({
                        title: 'Narrow Variant',
                        variant: 'narrow',
                        items: [
                          { id: 'n1', label: 'Workflow Alpha', icon: 'video' },
                          { id: 'n2', label: 'Workflow Beta', icon: 'image' },
                          { id: 'n3', label: 'Workflow Gamma', icon: 'music' },
                        ],
                        itemActions: [
                          {
                            icon: 'copy',
                            title: 'Duplicate',
                            onClick: (item) => console.log('Duplicate:', item),
                            closeAfter: true,
                          },
                          {
                            icon: 'trash',
                            color: 'danger',
                            title: 'Delete',
                            onClick: (item) => console.log('Delete:', item),
                          },
                        ],
                        onSelectItem: (item) => {
                          console.log('Selected:', item)
                        },
                      })
                    }}
                  >
                    Narrow Variant
                  <//>

                  <${Button}
                    icon="loader"
                    color="secondary"
                    onClick=${() => {
                      showListSelect({
                        title: 'Loading State',
                        items: [],
                        emptyMessage: 'Loading...',
                      })
                    }}
                  >
                    Loading State
                  </>

                  <${Button}
                    icon="x-circle"
                    color="secondary"
                    onClick=${() => {
                      showListSelect({
                        title: 'Empty List',
                        items: [],
                      })
                    }}
                  >
                    Empty State
                  <//>

                  <${SearchableListSelectDemo} />
                <//>
              </${Section}>

              <${Section}>
                <${SectionTitle}>Hover Panel Component<//>
                <p style="margin-bottom: 16px; opacity: 0.7;">Context-based hover panel for tooltips and floating content</p>

                <${ComponentGrid}>
                  <${HoverPanelTriggers} />
                </>
              <//>

              <${Section}>
                <${SectionTitle}>FloatingPanel Component<//>
                <p style="margin-bottom: 16px; opacity: 0.7;">Draggable, portal-rendered overlay panel with optional toolbar actions</p>

                <${ComponentGrid}>
                  <div style="display: flex; flex-direction: column; gap: 8px;">
                    <${Button}
                      color="primary"
                      onClick=${() =>
                        this.setState({
                          floatingPanelOpen: true,
                          floatingPanelPosition: 'center',
                          floatingPanelVariant: 'elevated',
                        })}
                    >
                      Show Floating Panel (Center)
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() =>
                        this.setState({
                          floatingPanelOpen: true,
                          floatingPanelPosition: 'top-right',
                          floatingPanelVariant: 'elevated',
                        })}
                    >
                      Show Panel (Top Right)
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() =>
                        this.setState({
                          floatingPanelOpen: true,
                          floatingPanelPosition: 'bottom-left',
                          floatingPanelVariant: 'outlined',
                        })}
                    >
                      Show Panel (Bottom Left, Outlined)
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() =>
                        this.setState({
                          floatingPanelOpen: true,
                          floatingPanelPosition: 'left',
                          floatingPanelVariant: 'glass',
                        })}
                    >
                      Show Panel (Left, Glass)
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() =>
                        this.setState({
                          floatingPanelOpen: true,
                          floatingPanelPosition: 'top',
                          floatingPanelVariant: 'default',
                        })}
                    >
                      Show Panel (Top, Default)
                    <//>
                  </div>
                <//>

                <${FloatingPanel}
                  isOpen=${this.state.floatingPanelOpen}
                  onClose=${() => this.setState({ floatingPanelOpen: false })}
                  initialPosition=${this.state.floatingPanelPosition}
                  variant=${this.state.floatingPanelVariant}
                  width="400px"
                  actions=${[
                    {
                      icon: 'refresh',
                      color: 'primary',
                      onClick: () => {
                        console.log('Refresh action clicked')
                      },
                    },
                    {
                      icon: 'save',
                      color: 'success',
                      onClick: () => {
                        console.log('Save action clicked')
                      },
                    },
                  ]}
                  footer=${html`
                    <${Button}
                      onClick=${() => {
                        console.log('Cancel button clicked')
                      }}
                    >
                      Cancel
                    <//>
                    <${Button}
                      color="primary"
                      onClick=${() => {
                        console.log('Save button clicked')
                      }}
                    >
                      Save
                    <//>
                  `}
                >
                  <h3 style="margin-top: 0;">Floating Panel Demo</h3>
                  <p>This panel is draggable. Grab the handle (menu icon) at the top-left and drag to move it.</p>
                  <p style="margin-top: 16px;">Features:</p>
                  <ul style="padding-left: 20px;">
                    <li>Portal rendering to document.body</li>
                    <li>Draggable via toolbar handle</li>
                    <li>Multiple initial positions</li>
                    <li>Variant styles (default, elevated, outlined, glass)</li>
                    <li>Optional action buttons in toolbar</li>
                    <li>Optional close button</li>
                    <li>Optional footer slot for action buttons</li>
                  </ul>
                  <p style="margin-top: 16px;">Position: <strong>${this.state.floatingPanelPosition}</strong></p>
                  <p>Variant: <strong>${this.state.floatingPanelVariant}</strong></p>
                <//>
              <//>

              <!-- More component sections will be added as they are refactored -->

              <!-- SearchSelectModal -->
              <${Section}>
                <${SectionTitle}>Search Select Modal</${SectionTitle}>
                <p style="margin-bottom: 16px; opacity: 0.7;">Generic search-and-select modal with single and multi modes. Supports string arrays and {label, value} arrays.</p>

                <div style="display: flex; flex-direction: column; gap: 12px;">
                  <!-- Single-select trigger -->
                  <${Button}
                    color="primary"
                    onClick=${() => this.setState({ searchSelectSingleOpen: true })}
                  >
                    Open Single-Select Modal
                  <//>
                  ${this.state.searchSelectSingleResult != null ? html`<p style="opacity: 0.7; font-size: 14px;">Last selected: <strong>${this.state.searchSelectSingleResult}</strong></p>` : null}

                  <!-- Multi-select trigger -->
                  <${Button}
                    color="secondary"
                    onClick=${() => this.setState({ searchSelectMultiOpen: true })}
                  >
                    Open Multi-Select Modal
                  <//>
                  ${this.state.searchSelectMultiResult.length > 0 ? html`<p style="opacity: 0.7; font-size: 14px;">Selected: <strong>${this.state.searchSelectMultiResult.join(', ')}</strong></p>` : null}
                  ${this.state.searchSelectActionResult != null ? html`<p style="opacity: 0.7; font-size: 14px;">Last action: <strong>Clone ${this.state.searchSelectActionResult}</strong></p>` : null}
                </div>

                <!-- Single-select modal instance -->
                <${SearchSelectModal}
                  isOpen=${this.state.searchSelectSingleOpen}
                  title="Pick a Fruit"
                  items=${['Apple', 'Banana', 'Cherry', 'Dragonfruit', 'Elderberry', 'Fig', 'Grape', 'Honeydew', 'Kiwi', 'Lemon', 'Mango', 'Nectarine', 'Orange', 'Papaya', 'Quince']}
                  mode="single"
                  displayLimit=${10}
                  itemActions=${[{ icon: 'copy', title: 'Clone', onClick: (item) => this.setState({ searchSelectActionResult: item.label }), closeAfter: true }]}
                  onSelect=${(value) => this.setState({ searchSelectSingleResult: value })}
                  onClose=${() => this.setState({ searchSelectSingleOpen: false })}
                />

                <!-- Multi-select modal instance -->
                <${SearchSelectModal}
                  isOpen=${this.state.searchSelectMultiOpen}
                  title="Pick Colours"
                  items=${[
                    { label: 'Red', value: 'red' },
                    { label: 'Green', value: 'green' },
                    { label: 'Blue', value: 'blue' },
                    { label: 'Yellow', value: 'yellow' },
                    { label: 'Purple', value: 'purple' },
                    { label: 'Orange', value: 'orange' },
                    { label: 'Pink', value: 'pink' },
                    { label: 'Brown', value: 'brown' },
                    { label: 'Black', value: 'black' },
                    { label: 'White', value: 'white' },
                  ]}
                  mode="multi"
                  initialSelected=${this.state.searchSelectMultiResult}
                  itemActions=${[{ icon: 'copy', title: 'Clone', onClick: (item) => this.setState({ searchSelectActionResult: item.label }), closeAfter: true }]}
                  onSelect=${(values) => this.setState({ searchSelectMultiResult: values })}
                  onClose=${() => this.setState({ searchSelectMultiOpen: false })}
                />
              </${Section}>

              <${Section}>
                <${SectionTitle}>TransitionViewer</${SectionTitle}>
                <${TransitionViewerDemo} />
              </${Section}>

              <${Section}>
                <${SectionTitle}>Pill</${SectionTitle}>
                <${MutedText}>
                  Shared pill component — static, dismiss (× left), interactive icon, template choice.
                  All variants support five color themes and a disabled state.
                </${MutedText}>
                <${PillDemo} />

                <h4 style="margin: 16px 0 8px;">widthScale variants</h4>
                <${MutedText}>auto (default, fits content) | compact (80px) | normal (160px) | wide (320px) | full (100% + flex-grow).</${MutedText}>
                <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
                  <${Pill} widthScale="auto">auto<//>
                  <${Pill} widthScale="compact">compact<//>
                  <${Pill} widthScale="normal">normal (160px)<//>
                  <${Pill} widthScale="wide">wide (320px)<//>
                </div>
                <div style="margin-top: 8px; display: flex;">
                  <${Pill} widthScale="full">full<//>
                </div>
              </${Section}>

              <${Section}>
                <${SectionTitle}>PillSelectPanel</${SectionTitle}>
                <${MutedText}>
                  Anchored popup listing pill choices as Select-style option rows at the source pill's size, coloured only on hover and press.
                  The current value looks like the rest. Opened by a Pill's {{slot}} token (options) or its body (selectOptions);
                  Escape or a click outside closes it.
                </${MutedText}>
                <${PillSelectPanelDemo} />
              </${Section}>

              <${Section}>
                <${SectionTitle}>AutocompleteDropdown + useAutocomplete</${SectionTitle}>
                <${MutedText}>
                  Standalone autocomplete hook composed with a plain input. Type to filter suggestions;
                  showEmptyOnNoResults=false closes the dropdown when there are no matches.
                  Arrow keys navigate · Enter/Tab confirm · Esc closes.
                </${MutedText}>
                <${AutocompleteDemo} />
              </${Section}>

              <${Section}>
                <${SectionTitle}>AutocompleteInput</${SectionTitle}>
                <${MutedText}>
                  Packaged component: themed Input + useAutocomplete dropdown, confirmed suggestions
                  and typed text both flow through the same onValueChange callback.
                </${MutedText}>
                <${AutocompleteInputDemo} />
              </${Section}>

              <${Section}>
                <${SectionTitle}>ContentEditablePillInput</${SectionTitle}>
                <${MutedText}>
                  Contenteditable pill input with autocomplete dropdown.
                  Tab = autocomplete or verbatim pill · Comma = verbatim pill · Enter = newline (multiline mode).
                  Backspace on empty trailing text deletes the last pill.
                </${MutedText}>
                <${ContentEditablePillInputDemo} />

                <h4 style="margin: 16px 0 8px;">widthScale variants</h4>
                <${MutedText}>compact (80px) | normal (160px) | wide (320px) | full (100% + flex-grow, default); auto is not accepted.</${MutedText}>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <${ContentEditablePillInput} label="normal (160px)" widthScale="normal" values=${['alpha']} onValuesChange=${() => {}} />
                  <${ContentEditablePillInput} label="wide (320px)" widthScale="wide" values=${['alpha', 'beta']} onValuesChange=${() => {}} />
                  <div style="display: flex;">
                    <${ContentEditablePillInput} label="full (default)" widthScale="full" values=${['alpha', 'beta', 'gamma']} onValuesChange=${() => {}} />
                  </div>
                </div>
              </${Section}>

              <${Section}>
                <${SectionTitle}>Markdown</${SectionTitle}>
                <${MutedText}>
                  Themed markdown renderer driven by a vendored marked lexer — token tree walked
                  straight into Preact VNodes, so no HTML string is ever produced or injected.
                  Headings use an embedded scale sized to sit inside a bubble or panel;
                  images render as links; raw HTML renders as literal text.
                  The renderers prop is shallow-merged over defaultRenderers, so overriding one
                  arm inherits the rest.
                </${MutedText}>
                <${MarkdownDemo} />
              </${Section}>

                </${Page}>
              <//>
            <//>
          <//>
        <//>
        `
        }
      }

      // Render the test app
      render(html`<${TestApp} />`, document.getElementById('app'))
    </script>
  </body>
</html>
